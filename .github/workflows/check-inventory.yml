name: Check inventory

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# Runs queue instead of overlapping, so a full check is never cut short.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Apple Store pickup stock (scripts/check_inventory.py).
  apple:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # curl_cffi makes requests with Chrome's TLS fingerprint; Apple's bot protection
      # blocks Python's default HTTP client.
      - name: Install dependencies
        run: pip install --quiet curl_cffi

      - name: Run tests
        run: python -m unittest discover tests

      # The last published results, so setups and cities not checked this run carry forward.
      - name: Load previous results
        run: |
          git fetch --quiet --depth=1 origin gh-pages \
            && git show FETCH_HEAD:inventory.json > previous.json \
            || echo '{}' > previous.json

      - name: Check Apple Store pickup availability
        continue-on-error: true
        run: python scripts/check_inventory.py --out out/inventory.json --previous previous.json

      # Raw Apple responses for debugging (skipped on scheduled runs).
      - name: Diagnose Apple responses
        if: github.event_name != 'schedule'
        continue-on-error: true
        run: python scripts/diagnose.py && mv site/debug.json out/debug.json

      - uses: actions/upload-artifact@v4
        with:
          name: apple
          path: out/
          if-no-files-found: ignore
          retention-days: 1

  # Micro Center and Best Buy stock (scripts/check_retailers.py), on a separate runner.
  retailers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet curl_cffi

      - name: Check Micro Center and Best Buy
        continue-on-error: true
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: python scripts/check_retailers.py --out out/retailers.json

      - uses: actions/upload-artifact@v4
        with:
          name: retailers
          path: out/
          if-no-files-found: ignore
          retention-days: 1

  # Combine the results and publish to the gh-pages branch, which GitHub Pages serves at
  # https://<owner>.github.io/<repo>/.
  publish:
    needs: [apple, retailers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Keep the last published file for anything this run didn't produce.
      - name: Assemble site
        run: |
          git fetch --quiet --depth=1 origin gh-pages || true
          for f in inventory.json retailers.json retailers-debug.json debug.json; do
            if [ -f "artifacts/$f" ]; then
              cp "artifacts/$f" "site/$f"
            else
              git show "FETCH_HEAD:$f" > "site/$f" 2>/dev/null || rm -f "site/$f"
            fi
          done
          ls -la site

      # One commit, force-pushed, so history stays small.
      - name: Publish to GitHub Pages
        if: hashFiles('site/inventory.json') != ''
        working-directory: site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Inventory $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

name: Check inventory

on:
  schedule:
    - cron: "*/5 * * * *"  # backup; GitHub often delays or skips frequent schedules
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write  # to start the next run (see "Start the next run")

# Runs queue instead of overlapping, so a full check is never cut short.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Apple Store pickup stock, split across 4 runners. Each runner has its own IP, so each
  # gets its own share of Apple's rate limit (~60 requests) and the whole list is checked.
  apple:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # curl_cffi makes requests with Chrome's TLS fingerprint; Apple's bot protection
      # blocks Python's default HTTP client.
      - name: Install dependencies
        run: pip install --quiet curl_cffi

      - name: Run tests
        if: matrix.shard == 0
        run: python -m unittest discover tests

      # The last published results, so setups and areas not checked this run carry forward.
      - name: Load previous results
        run: |
          git fetch --quiet --depth=1 origin gh-pages \
            && git show FETCH_HEAD:inventory.json > previous.json \
            || echo '{}' > previous.json

      - name: Check Apple Store pickup availability
        continue-on-error: true
        timeout-minutes: 7
        run: >
          python scripts/check_inventory.py --shard ${{ matrix.shard }}/4
          --previous previous.json --out out/inventory-part-${{ matrix.shard }}.json

      # Raw Apple responses for debugging (skipped on scheduled and chained runs).
      - name: Diagnose Apple responses
        if: matrix.shard == 0 && github.event_name == 'push'
        continue-on-error: true
        run: python scripts/diagnose.py && mv site/debug.json out/debug.json

      - uses: actions/upload-artifact@v4
        with:
          name: apple-${{ matrix.shard }}
          path: out/
          if-no-files-found: ignore
          retention-days: 1

  # Micro Center (behind Cloudflare, so a real Chromium under xvfb) and Best Buy.
  retailers:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --quiet curl_cffi playwright
          python -m playwright install --with-deps chromium

      - name: Check Micro Center and Best Buy
        continue-on-error: true
        env:
          BESTBUY_API_KEY: ${{ secrets.BESTBUY_API_KEY }}
        run: xvfb-run --auto-servernum python scripts/check_retailers.py --out out/retailers.json

      - uses: actions/upload-artifact@v4
        with:
          name: retailers
          path: out/
          if-no-files-found: ignore
          retention-days: 1

  # Combine the results and publish to the gh-pages branch, which GitHub Pages serves at
  # https://<owner>.github.io/<repo>/.
  publish:
    needs: [apple, retailers]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Merge the Apple parts; keep the last published file for anything this run didn't produce.
      - name: Assemble site
        run: |
          git fetch --quiet --depth=1 origin gh-pages || true
          git show FETCH_HEAD:inventory.json > previous.json 2>/dev/null || echo '{}' > previous.json
          git show FETCH_HEAD:history.json > site/history.json 2>/dev/null || echo '{}' > site/history.json
          python scripts/merge_inventory.py site/inventory.json artifacts/inventory-part-*.json \
            --previous previous.json --history site/history.json || true
          for f in inventory.json retailers.json retailers-debug.json debug.json; do
            if [ -f "artifacts/$f" ]; then
              cp "artifacts/$f" "site/$f"
            elif [ ! -f "site/$f" ]; then
              git show "FETCH_HEAD:$f" > "site/$f" 2>/dev/null || rm -f "site/$f"
            fi
          done
          ls -la site

      # One commit, force-pushed, so history stays small.
      - name: Publish to GitHub Pages
        if: hashFiles('site/inventory.json') != ''
        working-directory: site
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Inventory $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      # GitHub's 5-minute schedule is unreliable, so each run starts the next one about
      # 5 minutes after it began, unless another run is already queued or running.
      - name: Start the next run
        if: always()
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAUSE_CHECKS: ${{ vars.PAUSE_CHECKS }}
        run: python scripts/next_run.py
